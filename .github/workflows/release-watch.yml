name: release-watch
on:
  schedule:
    - cron: "*/20 * * * *"      # 每 20 分钟
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run watcher
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py
      - name: Persist state.json
        run: |
          git config user.name  "release-watcher"
          git config user.email "release-watcher@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "chore: update release state [skip ci]"
          git push || true
